name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: 단위 테스트
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee test.log || {
            # 로그 저장소에 접근할 수 없는 환경에서도 원인을 볼 수 있게 실패 줄을 주석(annotation)으로 남김
            grep -E "^e: |error:|FAILED|Exception|Caused by" test.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - name: 린트
        run: ./gradlew :app:lintDebug
      - name: 디버그 APK 빌드
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
      - name: 테스트 결과 요약
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as E
          t = f = 0
          for p in glob.glob('app/build/test-results/**/TEST-*.xml', recursive=True):
              r = E.parse(p).getroot(); t += int(r.get('tests')); f += int(r.get('failures')) + int(r.get('errors'))
          print(f"### 단위 테스트: {t}개 중 실패 {f}개")
          PY
      - name: 최신 APK를 릴리스로 게시 (main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AosPods-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          (cd app/build/screens 2>/dev/null && zip -q ../../../screens.zip *.png *.txt) || true
          gh release create latest AosPods-debug.apk $( [ -f screens.zip ] && echo screens.zip ) --prerelease \
            --title "최신 디버그 빌드 (${GITHUB_SHA::7})" \
            --notes "main 브랜치 최신 커밋 ${GITHUB_SHA::7}의 디버그 서명 APK입니다. 폰에서 내려받아 설치하세요."
